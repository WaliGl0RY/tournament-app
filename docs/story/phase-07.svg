<text x="53" y="42" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">07</text>
<text x="90" y="44" fill="#f5f0fa" font-size="21" font-weight="700">Running the real night</text>
<text x="30" y="74" fill="#a39cae" font-size="14">12.06.2026 · 6 commits</text>
<text x="30" y="104" fill="#ece6f2" font-size="16">A supervisor role, one queue of scores to validate, walkover for</text>
<text x="30" y="127" fill="#ece6f2" font-size="16">missing results, renaming and team reassignment.</text>
<text x="30" y="162" fill="#c4b5fd" font-size="16" font-style="italic">“I couldn&#x27;t always be there as the admin. If someone rage-quit or a</text>
<text x="30" y="185" fill="#c4b5fd" font-size="16" font-style="italic">score needed fixing, someone had to step in. So whoever creates</text>
<text x="30" y="208" fill="#c4b5fd" font-size="16" font-style="italic">a tournament becomes its supervisor, and can give that role to</text>
<text x="30" y="231" fill="#c4b5fd" font-size="16" font-style="italic">people they trust.”</text>
