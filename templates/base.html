<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Tournament{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

  {% block nav %}
  <nav class="navbar">
    <span class="nav-brand">🏆 <span id="nav-tournament-name">Tournament</span></span>
    <div class="nav-links">
      <a href="/dashboard" class="nav-link {% if request.path == '/dashboard' %}active{% endif %}">Table</a>
      <a href="/matches"   class="nav-link {% if request.path == '/matches'   %}active{% endif %}">Matches</a>
      <a href="/admin"     class="nav-link {% if request.path == '/admin'     %}active{% endif %}" id="nav-admin">Create</a>
      <a href="/manage"    class="nav-link {% if request.path == '/manage'    %}active{% endif %}" id="nav-manage" style="display:none">Manage</a>
      <a href="/logs"      class="nav-link {% if request.path == '/logs'      %}active{% endif %}" id="nav-logs"   style="display:none">Logs</a>
    </div>
    <div class="nav-user">
      <span id="nav-username"></span>
      <button class="btn-ghost-sm" onclick="logout()">Log out</button>
    </div>
  </nav>
  {% endblock %}

  <main>{% block content %}{% endblock %}</main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
  {% block scripts %}{% endblock %}

  <script>
    (function() {
      const username = (localStorage.getItem('username') || '').toLowerCase();
      if (username === 'walid') {
        const m = document.getElementById('nav-manage');
        const l = document.getElementById('nav-logs');
        if (m) m.style.display = '';
        if (l) l.style.display = '';
      }
    })();
  </script>
</body>
</html>
